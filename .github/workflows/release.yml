name: Release

on:
  push:
    tags: ['v*']

env:
  HELM_VERSION: v3.19.0
  CHART_REGISTRY: oci://ghcr.io/newworldorg/charts

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: The tag is the version Chart.yaml declares, or a prerelease of it (v0.1.0-rc.1 for 0.1.0), and appVersion is the same number
        id: version
        run: |
          declared=$(sed -n 's/^version: *//p' charts/pyxis/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: *//p' charts/pyxis/Chart.yaml)
          version=${GITHUB_REF_NAME#v}
          if [ "${version%%-*}" != "${declared}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not v${declared} or a prerelease of it, the version Chart.yaml declares" >&2
            exit 1
          fi
          if [ "${app_version}" != "${declared}" ]; then
            echo "appVersion ${app_version} is not the chart version ${declared}" >&2
            exit 1
          fi
          case "${version}" in
            *-*) prerelease=yes ;;
            *) prerelease=no ;;
          esac
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"
      - name: The images in compose.yml, values.yaml and Chart.yaml are the same versions
        run: scripts/check-versions.sh
      - name: No chart of this version is in the registry yet
        run: |
          if helm show chart "${CHART_REGISTRY}/pyxis" --version "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "pyxis ${{ steps.version.outputs.version }} is already in ${CHART_REGISTRY}" >&2
            exit 1
          fi

  chart:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint with every set of values under ci/
        run: |
          for values in charts/pyxis/ci/*-values.yaml; do
            helm lint --strict charts/pyxis -f "${values}"
          done
      - name: Package the chart as the tag's version and push it to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package charts/pyxis --destination "${RUNNER_TEMP}" \
            --version "${{ needs.version.outputs.version }}" --app-version "${{ needs.version.outputs.version }}"
          helm push "${RUNNER_TEMP}/pyxis-${{ needs.version.outputs.version }}.tgz" "${CHART_REGISTRY}"
      - name: The pushed chart can be read back by version
        run: helm show chart "${CHART_REGISTRY}/pyxis" --version "${{ needs.version.outputs.version }}"

  github-release:
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: A GitHub Release for the tag, with the images this version pins and whether the driver changes
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "the release ${GITHUB_REF_NAME} is already there and is left as it is."
            exit 0
          fi
          PYXIS_VERSION="${{ needs.version.outputs.version }}" scripts/release-notes.sh "${{ needs.version.outputs.previous }}" > "${RUNNER_TEMP}/notes.md"
          flags=""
          if [ "${{ needs.version.outputs.prerelease }}" = yes ]; then
            flags="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" ${flags}
