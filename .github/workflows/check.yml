name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install yamllint==1.38.0
      - run: yamllint --strict .

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The .env a check needs, with every required value filled in
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=check
          CARINA_DB_DIR=${RUNNER_TEMP}/pyxis/db
          CARINA_RECORDINGS_DIR=${RUNNER_TEMP}/pyxis/recordings
          CARINA_ENCODES_DIR=${RUNNER_TEMP}/pyxis/encodes
          CARINA_KEYS_DIR=${RUNNER_TEMP}/pyxis/keys
          EOF
      - name: compose.yml on its own
        run: docker compose config -q
      - name: compose.yml with every device file laid over it
        run: docker compose -f compose.yml -f examples/tuner-dvb.yml -f examples/tuner-usb.yml -f examples/gpu-intel.yml -f examples/gpu-nvidia.yml config -q

  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The .env of a host with a synthetic tuner and the proxy on a spare port
        run: |
          mkdir -p "${RUNNER_TEMP}"/pyxis/{db,recordings,encodes,keys}
          cat > .env <<EOF
          POSTGRES_PASSWORD=check
          CARINA_DB_DIR=${RUNNER_TEMP}/pyxis/db
          CARINA_RECORDINGS_DIR=${RUNNER_TEMP}/pyxis/recordings
          CARINA_ENCODES_DIR=${RUNNER_TEMP}/pyxis/encodes
          CARINA_KEYS_DIR=${RUNNER_TEMP}/pyxis/keys
          PYXIS_HTTP_PORT=18080
          PYXIS_HTTPS_PORT=18443
          EOF
      - run: docker compose up -d --quiet-pull
      - name: Through the proxy, /api/health and /login answer 200 within 3 minutes
        run: |
          for _ in $(seq 1 180); do
            health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/health || true)
            login=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/login || true)
            if [ "$health" = 200 ] && [ "$login" = 200 ]; then
              echo "health=$health login=$login"
              curl -s http://127.0.0.1:18080/api/health
              echo
              exit 0
            fi
            sleep 1
          done
          echo "health=$health login=$login after 180s"
          exit 1
      - name: Every service is healthy or has finished
        run: |
          docker compose ps -a
          for _ in $(seq 1 60); do
            unhealthy=$(docker compose ps -a --format '{{.Service}} {{.Health}} {{.ExitCode}} {{.State}}' \
              | awk '$4 == "exited" && $3 != 0 || $4 == "running" && $2 != "healthy" && $2 != ""' | wc -l)
            [ "$unhealthy" = 0 ] && exit 0
            sleep 2
          done
          docker compose ps -a
          exit 1
      - name: What each service said, when something did not come up
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs
      - name: Take everything down, volumes included
        if: always()
        run: docker compose down -v -t 60

  kind-up:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.31.0
          cluster_name: pyxis-check
      - name: On kind, the chart with a synthetic tuner, the bundled database and no GPU comes up, app and vela answer, and app subscribes to the driver
        run: scripts/check-kind.sh
        env:
          PYXIS_KIND_KEEP: 1

  chart:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: kubeconform, pinned by version and checksum
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -C "${RUNNER_TEMP}/bin" -xzf kubeconform.tar.gz kubeconform
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: The images in compose.yml, values.yaml and Chart.yaml are the same versions
        run: scripts/check-versions.sh
      - name: helm lint with every set of values under ci/
        run: |
          for values in charts/pyxis/ci/*-values.yaml; do
            echo "== ${values}"
            helm lint --strict charts/pyxis -f "${values}"
          done
      - name: helm template and kubeconform with every set of values under ci/, IngressRoute checked against the Traefik CRD schema
        run: |
          for values in charts/pyxis/ci/*-values.yaml; do
            echo "== ${values}"
            helm template carina charts/pyxis -f "${values}" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: No chart version in the Pod templates, the checksum on the driver only, Service names from the release name
        run: scripts/check-rendering.sh
