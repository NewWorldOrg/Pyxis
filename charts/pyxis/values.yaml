# すべての Pod に適用する nodeSelector。driver と app はソケットのディレクトリを hostPath で共有するので、ノードが複数なら同じノードを指定する
nodeSelector: {}
# イメージの pull に使う Secret の名前の一覧。GHCR の公開イメージなら要らない
imagePullSecrets: []

carina:
  # app を動かす uid。鍵のディレクトリやエンコード済みファイルの所有者になる
  uid: 10001
  # app を動かす gid。driver のソケットの所有グループ (driver.json の socketGroupId) にもチャートが同じ値を設定する
  gid: 10001

driver:
  # driver の Deployment と ConfigMap を作るか
  enabled: true
  image:
    # driver のイメージ
    repository: ghcr.io/newworldorg/puppis
    # driver のイメージのタグ。compose.yml と同じバージョンにする
    tag: v0.5.0
    # イメージの pull ポリシー
    pullPolicy: IfNotPresent
  # driver.json の内容をそのまま書く。socketGroupId はチャートが carina.gid の値を設定し、socketPath は既定 (/run/carina/driver.sock) のままにする
  config:
    # 録画の保存先。app の Integrity__OutputRoots と同じ名前とパスにする
    outputRoots:
      - name: primary
        path: /srv/recordings
    # 録画中に停止を要求されたとき、録画の終了を待つ時間の上限
    shutdownGraceHours: 6
    tuner:
      # dvb、usb、fake のどれか。既定はテスト用の擬似チューナー (fake)
      backend: fake
    # チューナーの一覧。dvb と usb なら devicePath も書く
    devices:
      - id: fake-terrestrial
        kind: terrestrial
        enabled: true
      - id: fake-satellite
        kind: satellite
        enabled: true
  # ホストのデバイスのディレクトリの一覧。同じパスに hostPath でマウントする (/dev/dvb/adapter0 や /dev/bus/usb)
  hostDevices: []
  pcscd:
    # ホストの pcscd の /run/pcscd をディレクトリごと読み取り専用で渡すか。tuner.backend が dvb なら要る
    enabled: false
  socket:
    # driver と app が共有するソケットのディレクトリのホスト側のパス。無ければ作る
    hostPath: /run/pyxis
  # ホストのネットワークで動かすか。カードを貸す driver は true にして、ポートを Pod のネットワークの外に公開する
  hostNetwork: false
  lendingKey:
    # カードの貸し借りの鍵を持つ Secret の名前。空なら渡さない
    existingSecret: ""
    # その Secret の中で鍵を持つキー。/etc/puppis/lending.key に所有者だけが読めるパーミッションでマウントする
    key: key
  # 停止するときに録画の終了を待つ秒数。config.shutdownGraceHours より長くする
  terminationGracePeriodSeconds: 25200
  # driver だけに適用する nodeSelector。空なら最上位の nodeSelector を使う
  nodeSelector: {}
  # driver の resources
  resources: {}

app:
  # app の Deployment と Service を作るか
  enabled: true
  image:
    # app と migrate のイメージ
    repository: ghcr.io/newworldorg/carina
    # app のイメージのタグ。compose.yml と同じバージョンにする
    tag: v2.1.1
    # イメージの pull ポリシー
    pullPolicy: IfNotPresent
  # ブラウザから見たこのサーバのアドレス (https://tv.example.com)。OIDC の redirect URI の元になる
  publicOrigin: ""
  # X-Forwarded-* を信頼するリバースプロキシのネットワーク (CIDR) の一覧 (10.42.0.0/16 など)。Ingress コントローラの Pod がいるネットワークを書く
  knownNetworks: []
  # 録画をあとからエンコードするときのエンコーダー。Software、Vaapi、Nvenc のどれか
  encodingsPrefer: Software
  # ライブと録画再生をリアルタイムでトランスコードするときのエンコーダー。Software、Vaapi、Nvenc のどれか
  transcodingPrefer: Software
  gpu:
    # GPU の渡し方。none、devicePlugin (Intel の device plugin)、hostPath (/dev/dri をマウントし、app を特権コンテナにする)、
    # nvidia (NVIDIA Container Toolkit と device plugin。Nvenc で使う。ホストのドライバは 530.41.03 以上)
    mode: none
    # devicePlugin のときに要求するリソースの名前
    resource: gpu.intel.com/i915
    # nvidia のときに app に付ける RuntimeClass の名前
    runtimeClassName: nvidia
    # nvidia のときに要求するリソースの名前
    nvidiaResource: nvidia.com/gpu
    # nvidia のときに要求する GPU の数
    nvidiaCount: 1
    # VAAPI (devicePlugin と hostPath) で使う GPU の render ノード。nvidia では使わない
    renderNode: /dev/dri/renderD128
    # hostPath のときにホストからマウントするデバイスのディレクトリ
    hostPath: /dev/dri
  dataProtection:
    # ASP.NET Core Data Protection の鍵ファイルを持つ Secret の名前。keys のボリュームに同じ名前のファイルが無いときだけコピーする。空なら app が初回に鍵を生成する
    seedSecret: ""
  # app に足す環境変数の一覧 (name と value)。Encodings__MostCores などの細かい設定に使う
  extraEnv: []
  # app だけに適用する nodeSelector。空なら最上位の nodeSelector を使う
  nodeSelector: {}
  # app の resources。devicePlugin と nvidia のときは GPU のリソースをチャートが追加する
  resources: {}

postgres:
  # 同梱のデータベース (StatefulSet と Service) を作るか。false なら externalDatabase を使う
  enabled: true
  image:
    # PostgreSQL のイメージ
    repository: postgres
    # PostgreSQL のイメージのタグ。compose.yml と同じバージョンにする
    tag: 18.6-trixie
    # イメージの pull ポリシー
    pullPolicy: IfNotPresent
  auth:
    # データベースの名前
    database: carina
    # データベースのユーザ名
    username: carina
    # パスワードを持つ Secret の名前。空なら password から Secret を作る
    existingSecret: ""
    # その Secret の中のパスワードのキー
    passwordKey: password
    # existingSecret が空のときに Secret に入れるパスワード。`;` は使えない。どちらも空だとレンダリングが失敗する
    password: ""
  # データベースだけに適用する nodeSelector。空なら最上位の nodeSelector を使う
  nodeSelector: {}
  # データベースの resources
  resources: {}

externalDatabase:
  # postgres.enabled が false のとき、接続文字列を持つ Secret の名前
  connectionSecret: ""
  # その Secret の中の接続文字列のキー
  connectionKey: connection

vela:
  # Vela の Deployment と Service を作るか
  enabled: true
  image:
    # Vela のイメージ
    repository: ghcr.io/newworldorg/vela
    # Vela のイメージのタグ。compose.yml と同じバージョンにする
    tag: v1.4.1
    # イメージの pull ポリシー
    pullPolicy: IfNotPresent
  # Vela だけに適用する nodeSelector。空なら最上位の nodeSelector を使う
  nodeSelector: {}
  # Vela の resources
  resources: {}

route:
  # 外部からのリクエストを app と Vela に振り分けるリソースの種類。ingress (標準の Ingress)、ingressRoute (Traefik の IngressRoute)、none (作らず、リバースプロキシを自分で用意する)
  kind: ingress
  # ブラウザが開くホスト名 (tv.example.com)。空ならホスト名を問わず、すべてのリクエストを受ける
  host: ""
  ingress:
    # Ingress の ingressClassName。空なら書かない
    className: ""
    # Ingress の annotations。SSE と WebSocket をバッファリングしない設定は Ingress コントローラごとに違う
    annotations: {}
    # Ingress の tls の一覧 (hosts と secretName)
    tls: []
  ingressRoute:
    # IngressRoute の entryPoints
    entryPoints:
      - websecure
    # IngressRoute の tls。{} なら Traefik の既定の証明書、null なら http
    tls: {}

# ボリュームごとに type を pvc、existingClaim、hostPath から選ぶ。thumbnails、captions、state は emptyDir も選べる
persistence:
  recordings:
    # 録画。driver が書き込み、app は読み取り専用でマウントする
    type: pvc
    # pvc のときのサイズ
    size: 500Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type。Directory ならディレクトリが無いと Pod が起動しない
      type: Directory
  encodes:
    # エンコード済みのファイル。app が書き込む
    type: pvc
    # pvc のときのサイズ
    size: 200Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  thumbnails:
    # サムネイル。app が書き込む。emptyDir なら Pod と一緒に消え、再生成される
    type: pvc
    # pvc のときのサイズ
    size: 5Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  captions:
    # 録画から抽出した字幕とデータ放送の記録。app が書き込む。emptyDir なら Pod と一緒に消え、抽出し直される
    type: pvc
    # pvc のときのサイズ
    size: 5Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  keys:
    # OIDC の client secret や通知の送り先を暗号化する鍵 (ASP.NET Core Data Protection) と、Web Push の署名に使う鍵。データベースとは別にバックアップする
    type: pvc
    # pvc のときのサイズ
    size: 100Mi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  db:
    # 同梱のデータベースのデータ
    type: pvc
    # pvc のときのサイズ
    size: 20Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  state:
    # チューナーと局の組み合わせごとの受信の記録。driver が書き込む。emptyDir なら Pod と一緒に消え、driver が測り直す
    type: pvc
    # pvc のときのサイズ
    size: 100Mi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
