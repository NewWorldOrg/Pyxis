# 全部の Pod に当てる nodeSelector。driver と app はソケットのディレクトリを hostPath で共有するので、ノードが複数なら同じノードを指す
nodeSelector: {}
# イメージを引くときに使う Secret の名前の一覧。GHCR の公開イメージなら要らない
imagePullSecrets: []

carina:
  # app を動かす uid。鍵の置き場やエンコード済みファイルの持ち主になる
  uid: 10001
  # app を動かす gid。driver のソケットの所有グループ (driver.json の socketGroupId) にも同じ値を入れる
  gid: 10001

driver:
  # driver の Deployment と ConfigMap を作るか
  enabled: true
  image:
    # driver のイメージ
    repository: ghcr.io/newworldorg/puppis
    # driver のイメージのタグ。compose.yml と同じ版にする
    tag: v0.2.0
    # イメージを引く条件
    pullPolicy: IfNotPresent
  # driver.json の中身をそのまま書く。socketGroupId はチャートが carina.gid で入れ、socketPath は既定 (/run/carina/driver.sock) のままにする
  config:
    # 録画の保存先。app の Integrity__OutputRoots と同じ名前とパスにする
    outputRoots:
      - name: primary
        path: /srv/recordings
    # 録画中に止められたとき、録画の終わりを待つ上限の時間
    shutdownGraceHours: 6
    tuner:
      # dvb、usb か fake。置いてあるのは合成のチューナー
      backend: fake
    # チューナーの一覧。dvb と usb なら devicePath も書く
    devices:
      - id: fake-terrestrial
        kind: terrestrial
        enabled: true
      - id: fake-satellite
        kind: satellite
        enabled: true
  # ホストの装置のディレクトリの一覧。同じパスで hostPath で渡す (/dev/dvb/adapter0 や /dev/bus/usb)
  hostDevices: []
  pcscd:
    # ホストの pcscd の /run/pcscd をディレクトリごと読み取り専用で渡すか。tuner.backend が dvb なら要る
    enabled: false
  socket:
    # driver と app が共有するソケットのディレクトリのホスト側のパス。無ければ作る
    hostPath: /run/pyxis
  # ホストのネットワークで動かすか。カードを貸す driver は true にして、口を Pod の網の外に開く
  hostNetwork: false
  lendingKey:
    # カードの貸し借りの鍵を持つ Secret の名前。空なら渡さない
    existingSecret: ""
    # その Secret の中の鍵のキー。/etc/puppis/lending.key に所有者だけが読める形で置く
    key: key
  # 止めるときに録画の終わりを待つ秒数。config.shutdownGraceHours より長くする
  terminationGracePeriodSeconds: 25200
  # driver だけに当てる nodeSelector。空なら上の nodeSelector を使う
  nodeSelector: {}
  # driver の resources
  resources: {}

app:
  # app の Deployment と Service を作るか
  enabled: true
  image:
    # app と migrate のイメージ
    repository: ghcr.io/newworldorg/carina
    # app のイメージのタグ。compose.yml と同じ版にする
    tag: v2.0.0
    # イメージを引く条件
    pullPolicy: IfNotPresent
  # ブラウザからこのサーバに届くアドレス (https://tv.example.com)。OIDC の redirect URI の元になる
  publicOrigin: ""
  # X-Forwarded-* を信じる前段の網の一覧 (10.42.0.0/16 など)。Ingress のコントローラの Pod がいる網を書く
  knownNetworks: []
  # 録画をあとからエンコードするときの変換器。Software、Vaapi、Nvenc のどれか
  encodingsPrefer: Software
  # ライブと録画再生をその場で変換するときの変換器。Software、Vaapi、Nvenc のどれか
  transcodingPrefer: Software
  gpu:
    # GPU の渡し方。none、devicePlugin (Intel の device plugin)、hostPath (/dev/dri を渡し、app を特権にする)、
    # nvidia (NVIDIA Container Toolkit と device plugin。Nvenc で使う。ホストのドライバは 530.41.03 以上)
    mode: none
    # devicePlugin のときに要求する資源の名前
    resource: gpu.intel.com/i915
    # nvidia のときに app に付ける RuntimeClass の名前
    runtimeClassName: nvidia
    # nvidia のときに要求する資源の名前
    nvidiaResource: nvidia.com/gpu
    # nvidia のときに要求する GPU の数
    nvidiaCount: 1
    # VAAPI (devicePlugin と hostPath) で使う GPU の描画ノード。nvidia では使わない
    renderNode: /dev/dri/renderD128
    # hostPath のときにホストから渡す装置のディレクトリ
    hostPath: /dev/dri
  dataProtection:
    # OIDC の client secret を封じる鍵の種を持つ Secret の名前。鍵の置き場が空のときだけ写す。空なら app が初回に作る
    seedSecret: ""
  # app に足す環境変数の一覧 (name と value)。Encodings__MostCores などの細かい設定に使う
  extraEnv: []
  # app だけに当てる nodeSelector。空なら上の nodeSelector を使う
  nodeSelector: {}
  # app の resources。devicePlugin と nvidia のときは GPU の資源をチャートが足す
  resources: {}

postgres:
  # 同梱のデータベース (StatefulSet と Service) を作るか。false なら externalDatabase を使う
  enabled: true
  image:
    # PostgreSQL のイメージ
    repository: postgres
    # PostgreSQL のイメージのタグ。compose.yml と同じ版にする
    tag: 18.6-trixie
    # イメージを引く条件
    pullPolicy: IfNotPresent
  auth:
    # データベースの名前
    database: carina
    # データベースのユーザ名
    username: carina
    # パスワードを持つ Secret の名前。空なら password から Secret を作る
    existingSecret: ""
    # その Secret の中のパスワードのキー
    passwordKey: password
    # existingSecret が空のときに Secret に入れるパスワード。`;` は使えない。どちらも空だと描画が止まる
    password: ""
  # データベースだけに当てる nodeSelector。空なら上の nodeSelector を使う
  nodeSelector: {}
  # データベースの resources
  resources: {}

externalDatabase:
  # postgres.enabled が false のとき、接続文字列を持つ Secret の名前
  connectionSecret: ""
  # その Secret の中の接続文字列のキー
  connectionKey: connection

vela:
  # 画面の Deployment と Service を作るか
  enabled: true
  image:
    # 画面のイメージ
    repository: ghcr.io/newworldorg/vela
    # 画面のイメージのタグ。compose.yml と同じ版にする
    tag: v1.3.0
    # イメージを引く条件
    pullPolicy: IfNotPresent
  # 画面だけに当てる nodeSelector。空なら上の nodeSelector を使う
  nodeSelector: {}
  # 画面の resources
  resources: {}

route:
  # 前段の種類。ingress (標準の Ingress)、ingressRoute (Traefik の IngressRoute)、none (自前の前段)
  kind: ingress
  # ブラウザが開くホスト名 (tv.example.com)。空ならホスト名を見ずに全部を受ける
  host: ""
  ingress:
    # Ingress の ingressClassName。空なら書かない
    className: ""
    # Ingress の annotations。SSE と WebSocket を溜めない設定はコントローラごとに違う
    annotations: {}
    # Ingress の tls の一覧 (hosts と secretName)
    tls: []
  ingressRoute:
    # IngressRoute の entryPoints
    entryPoints:
      - websecure
    # IngressRoute の tls。{} なら Traefik の既定の証明書、null なら http
    tls: {}

# 置き場ごとに type を pvc、existingClaim、hostPath から選ぶ。thumbnails と captions は emptyDir も選べる
persistence:
  recordings:
    # 録画。driver が書き、app は読むだけ
    type: pvc
    # pvc のときの大きさ
    size: 500Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type。Directory なら無いときに起動しない
      type: Directory
  encodes:
    # エンコード済みのファイル。app が書く
    type: pvc
    # pvc のときの大きさ
    size: 200Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  thumbnails:
    # サムネイル。app が書く。emptyDir なら Pod と一緒に消え、作り直される
    type: pvc
    # pvc のときの大きさ
    size: 5Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  captions:
    # 録画から取り出した字幕とデータ放送の記録。app が書く。emptyDir なら Pod と一緒に消え、取り出し直される
    type: pvc
    # pvc のときの大きさ
    size: 5Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  keys:
    # OIDC の client secret を封じる鍵。データベースとは別に残す
    type: pvc
    # pvc のときの大きさ
    size: 100Mi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
  db:
    # 同梱のデータベースのデータ
    type: pvc
    # pvc のときの大きさ
    size: 20Gi
    # pvc のときの storageClassName。空なら既定、"-" なら無し
    storageClass: ""
    # pvc のときの accessModes
    accessModes:
      - ReadWriteOnce
    # existingClaim のときの PVC の名前
    existingClaim: ""
    hostPath:
      # hostPath のときのホスト側のパス
      path: ""
      # hostPath のときの type
      type: Directory
