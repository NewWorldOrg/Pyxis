# kind での起動テストで default-values.yaml に重ねる値。ファイル名を *-values.yaml にしないのは、chart の job が単体で lint とレンダリングをする values ファイルと区別するため。ボリュームのサイズを小さくし、そのほかは既定のまま
persistence:
  recordings:
    size: 1Gi
  encodes:
    size: 1Gi
  thumbnails:
    size: 256Mi
  captions:
    size: 256Mi
  keys:
    size: 64Mi
  db:
    size: 1Gi
  state:
    size: 64Mi
