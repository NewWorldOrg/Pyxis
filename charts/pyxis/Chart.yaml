apiVersion: v2
name: pyxis
description: A recording server for Japanese digital broadcasting, with Carina and Vela pinned to a verified set of image versions
type: application
version: 0.1.0
appVersion: 0.1.0
kubeVersion: ">=1.25.0-0"
home: https://github.com/NewWorldOrg/Pyxis
sources:
  - https://github.com/NewWorldOrg/Pyxis
  - https://github.com/NewWorldOrg/Carina
  - https://github.com/NewWorldOrg/Vela
keywords:
  - dtv
  - recording
  - carina
  - vela
annotations:
  # この版が固定するイメージの組。compose.yml と values.yaml の image と同じ値にする
  images/carina-app: ghcr.io/newworldorg/carina:app-v1.0.0
  images/carina-driver: ghcr.io/newworldorg/carina:driver-v1.0.0
  images/vela: ghcr.io/newworldorg/vela:v1.0.0
  images/postgres: postgres:18.6-alpine
