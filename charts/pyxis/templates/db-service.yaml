{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pyxis.partName" (dict "root" . "part" "db") }}
  labels:
    {{- include "pyxis.labels" (dict "root" . "part" "db") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pyxis.selectorLabels" (dict "root" . "part" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
