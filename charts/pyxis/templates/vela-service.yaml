{{- if .Values.vela.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pyxis.partName" (dict "root" . "part" "vela") }}
  labels:
    {{- include "pyxis.labels" (dict "root" . "part" "vela") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pyxis.selectorLabels" (dict "root" . "part" "vela") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
