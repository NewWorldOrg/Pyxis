{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- if not .Values.postgres.auth.password }}
{{- fail "postgres.auth.existingSecret か postgres.auth.password のどちらかにデータベースのパスワードを書く" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pyxis.partName" (dict "root" . "part" "db") }}
  labels:
    {{- include "pyxis.labels" (dict "root" . "part" "db") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordKey }}: {{ .Values.postgres.auth.password | quote }}
{{- end }}
