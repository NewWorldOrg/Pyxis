{{- if .Values.app.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pyxis.partName" (dict "root" . "part" "app") }}
  labels:
    {{- include "pyxis.labels" (dict "root" . "part" "app") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pyxis.selectorLabels" (dict "root" . "part" "app") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
