# Linux DVB のチューナーと B-CAS カード (ホストの pcscd) を driver に渡す。
# チューナーが増えたら devices の行を足し、driver/driver.json の devices にも同じデバイスを書く
services:
  driver:
    devices:
      - /dev/dvb/adapter0:/dev/dvb/adapter0
    volumes:
      # pcscd は再起動のたびにソケットを作り直すので、ファイルではなくディレクトリごとマウントする
      - /run/pcscd:/run/pcscd:ro
